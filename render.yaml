services:
  - type: web
    name: expense-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    disk:
      name: expense-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.13
      - key: DATA_DIR
        value: ./data
      - key: CURRENCY
        value: "₽"
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
